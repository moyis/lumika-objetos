backend:
  name: github
  repo: moyis/lumika-objetos
  branch: main
  base_url: https://lumika-decap-oauth.faustomoya-99.workers.dev
  auth_endpoint: auth

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: products
    label: Products
    label_singular: Product
    folder: src/content/products
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{currency}} {{price}}"
    sortable_fields: [title, price, date, stock]
    view_filters:
      - label: Featured
        field: featured
        pattern: true
      - label: Out of stock
        field: stock
        pattern: "^0$"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "URL segment, lowercase, dashes" }
      - { label: SKU, name: sku, widget: string, required: false }
      - label: Price
        name: price
        widget: number
        value_type: float
        min: 0
        step: 0.01
      - label: Currency
        name: currency
        widget: select
        default: USD
        options: [USD, EUR, MXN, COP, ARS, BRL]
      - { label: Stock, name: stock, widget: number, value_type: int, min: 0, default: 0 }
      - label: Category
        name: category
        widget: select
        options: [apparel, accessories, home, art, other]
      - { label: Featured, name: featured, widget: boolean, default: false }
      - label: Images
        name: images
        widget: list
        summary: "{{fields.image}}"
        field: { label: Image, name: image, widget: image }
      - { label: Created, name: date, widget: datetime }
      - { label: Description, name: body, widget: markdown }
