backend:
  name: github
  repo: moyis/lumika-objetos
  branch: main
  base_url: https://lumika-decap-oauth.faustomoya-99.workers.dev
  auth_endpoint: auth

locale: es

media_folder: src/assets/products
public_folder: ../../assets/products

collections:
  - name: products
    label: Productos
    label_singular: Producto
    folder: src/content/products
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{currency}} {{price}}"
    sortable_fields: [title, price, date, stock]
    view_filters:
      - label: Destacados
        field: featured
        pattern: true
      - label: Sin stock
        field: stock
        pattern: "^0$"
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Segmento URL, minúsculas, guiones" }
      - { label: SKU, name: sku, widget: string, required: false }
      - label: Precio
        name: price
        widget: number
        value_type: float
        min: 0
        step: 0.01
      - label: Moneda
        name: currency
        widget: select
        default: ARS
        options: [ARS]
      - { label: Stock, name: stock, widget: number, value_type: int, min: 0, default: 0 }
      - { label: Destacado, name: featured, widget: boolean, default: false }
      - { label: Subtítulo, name: subtitle, widget: string, required: false, hint: "Frase corta debajo del título" }
      - label: Etiquetas
        name: tags
        widget: select
        multiple: true
        required: false
        options: [velas, resina, nuevo, edicion-limitada]
        default: []
      - label: Imágenes
        name: images
        widget: list
        summary: "{{fields.image}}"
        field: { label: Imagen, name: image, widget: image }
      - { label: Creado, name: date, widget: datetime }
      - { label: Descripción, name: body, widget: markdown }
