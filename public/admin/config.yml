backend:
  name: github
  repo: moyis/lumika-objetos
  branch: main
  base_url: https://lumika-decap-oauth.faustomoya-99.workers.dev
  auth_endpoint: auth

locale: es

media_folder: src/assets/products
public_folder: ../../assets/products

collections:
  - name: products
    label: Productos
    label_singular: Producto
    folder: src/content/products
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{currency}} {{price}}"
    sortable_fields: [title, price, date, stock]
    view_filters:
      - label: Destacados
        field: featured
        pattern: true
      - label: Sin stock
        field: stock
        pattern: "^0$"
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Segmento URL, minúsculas, guiones" }
      - { label: SKU, name: sku, widget: string, required: false }
      - label: Precio
        name: price
        widget: number
        value_type: float
        min: 0
        step: 0.01
      - label: Moneda
        name: currency
        widget: select
        default: ARS
        options: [ARS]
      - { label: Stock, name: stock, widget: number, value_type: int, min: 0, default: 0 }
      - { label: Destacado, name: featured, widget: boolean, default: false }
      - label: Fragancias
        name: fragrances
        widget: relation
        collection: settings
        file: fragrances
        search_fields: ["fragrances.*"]
        value_field: "fragrances.*"
        display_fields: ["fragrances.*"]
        multiple: true
        required: false
        hint: "Esencias disponibles para esta vela (se editan en Configuración → Fragancias)"
        default: []
      - { label: Subtítulo, name: subtitle, widget: string, required: false, hint: "Frase corta debajo del título" }
      - label: Etiquetas
        name: tags
        widget: relation
        collection: settings
        file: tags
        search_fields: ["tags.*.label"]
        value_field: "tags.*.slug"
        display_fields: ["tags.*.label"]
        multiple: true
        required: false
        hint: "Categorías/etiquetas (se editan en Configuración → Etiquetas)"
        default: []
      - label: Imágenes
        name: images
        widget: list
        summary: "{{fields.image}}"
        field: { label: Imagen, name: image, widget: image }
      - { label: Creado, name: date, widget: datetime }
      - { label: Descripción, name: body, widget: markdown }

  - name: settings
    label: Configuración
    files:
      - name: tags
        label: Etiquetas / Categorías
        file: src/data/tags.json
        description: "Etiquetas de producto. También son las categorías que se muestran en el footer."
        fields:
          - label: Etiquetas
            name: tags
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Slug, name: slug, widget: string, hint: "Identificador en minúsculas y sin espacios, ej: edicion-limitada" }
              - { label: Nombre, name: label, widget: string }
      - name: fragrances
        label: Fragancias
        file: src/data/fragrances.json
        description: "Esencias disponibles para las velas."
        fields:
          - label: Fragancias
            name: fragrances
            widget: list
            field: { label: Fragancia, name: fragrance, widget: string }
