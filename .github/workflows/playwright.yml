name: Playwright Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bunx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium --with-deps

      - name: Cache Playwright system deps
        uses: awalsh128/cache-apt-pkgs-action@latest
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        with:
          packages: libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libcairo2 libcups2 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
          version: playwright-${{ steps.playwright-version.outputs.version }}

      # Cloudflare Workers Builds compiles every PR commit and reports a
      # check run whose summary contains the version preview URL. Wait for
      # it instead of building here.
      - name: Wait for Cloudflare Workers build
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 60); do
            run=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name | startswith("Workers Builds"))][0]')
            status=$(echo "$run" | jq -r '.status // empty')
            conclusion=$(echo "$run" | jq -r '.conclusion // empty')
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Cloudflare build finished with conclusion: $conclusion" >&2
                exit 1
              fi
              url=$(echo "$run" | jq -r '.output.summary' | grep -o 'Preview URL: https://[^ ]*' | cut -d' ' -f3)
              if [ -z "$url" ]; then
                echo "Build succeeded but no preview URL found in check run summary" >&2
                exit 1
              fi
              echo "Preview ready: $url"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for Cloudflare build ($i)..."
            sleep 10
          done
          echo "Timed out waiting for Cloudflare Workers build" >&2
          exit 1

      - name: Run Playwright tests against preview
        run: bunx playwright test
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.preview.outputs.url }}

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
