version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      time: "04:00"
    groups:
      all-deps:
        patterns: ["*"]
    ignore:
      # @astrojs/language-server (astro check) crashes on the TS 7 API
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      time: "04:00"
    groups:
      all-actions:
        patterns: ["*"]
